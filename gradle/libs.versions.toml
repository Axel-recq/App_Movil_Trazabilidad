[versions]
# Plugins
android-gradle-plugin = "8.3.2"
kotlin-gradle-plugin = "1.9.22"

# Librerías
mpandroidchart = "v3.1.0"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxConstraintlayout = "2.1.4"
androidxGridlayout = "1.0.0"
androidxActivity = "1.9.2"
androidxLifecycle = "2.8.6"
material = "1.12.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
playServicesMaps = "19.0.0"
playServicesLocation = "21.3.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
swiperefreshlayout = "1.1.0"
circleimageview = "3.1.0"
[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-gradle-plugin" }

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-gridlayout = { group = "androidx.gridlayout", name = "gridlayout", version.ref = "androidxGridlayout" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidxActivity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Retrofit y OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Play Services
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }

# MPAndroidChart
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }

circleimageview = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleimageview" }